name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Linux gets the distro's fish 3.x (no `history append`), macOS gets fish 4.x,
      # so both shell-integration code paths are exercised
      - name: Install fish and zsh for shell integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Install fish for shell integration tests
        if: runner.os == 'macOS'
        run: brew install fish
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test

  # build and test the standalone executables on every push, not only at release time
  binaries:
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: read
