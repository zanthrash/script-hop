name: Release

# Adapted from the Changesets trusted-publishing example:
# https://github.com/changesets/changesets/blob/main/site/guide/_snippets/automating-trusted-publishing.yaml
#
# With pending changesets on main, opens/updates a "Version Packages" PR.
# Once that PR is merged, packs and publishes to npm via trusted publishing (OIDC),
# so no npm token is stored. Only the publish job can mint an id-token, and it
# never runs the build.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@v2
        with:
          commit-message: 'Release: version packages'
          pr-title: 'Release: version packages'

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # tests also build dist/ (the e2e suite runs the built CLI)
      - run: pnpm typecheck
      - run: pnpm test
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.published == 'true' && fromJSON(steps.publish.outputs.published-packages)[0].version || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # this job can mint an npm publish token, so run no dependency install scripts here;
      # it only needs the changesets CLI
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true

  # standalone executables for the release: build and test on each platform...
  binaries:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.publish.outputs.version }}

  # ...then attach them to the GitHub release and update the Homebrew tap
  release-assets:
    name: Release assets and Homebrew tap
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.publish.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # only the executables: the run also has changesets' own artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: hop-*
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum hop-v*.tar.gz > checksums.txt && cat checksums.txt
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.publish.outputs.version }}" assets/hop-v*.tar.gz assets/checksums.txt --clobber --repo "${{ github.repository }}"

      - name: Generate the formula
        run: node scripts/homebrew-formula.ts "${{ needs.publish.outputs.version }}" assets/checksums.txt > script-hop.rb && cat script-hop.rb
      - uses: actions/checkout@v7
        with:
          repository: zanthrash/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the tap
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../script-hop.rb Formula/script-hop.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/script-hop.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "script-hop ${{ needs.publish.outputs.version }}"
          git push

