name: Binaries

# Builds the standalone `hop` executables (bun build --compile) on each platform, runs the
# end-to-end and real-shell tests against them, and uploads the archives as artifacts.
# Called from CI on every push and from Release, which then publishes the artifacts.
# Read-only on purpose: a reusable workflow can't ask for more than its caller grants.

on:
  workflow_call:
    inputs:
      version:
        description: Released version to build (e.g. 0.6.0), checked out from its tag. Empty = current commit.
        type: string
        default: ''
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest, bun: bun-darwin-arm64 }
          - { target: darwin-x64, os: macos-15-intel, bun: bun-darwin-x64-baseline }
          - { target: linux-x64, os: ubuntu-latest, bun: bun-linux-x64-baseline }
          - { target: linux-arm64, os: ubuntu-24.04-arm, bun: bun-linux-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # also installs the pinned bun (its postinstall is allowed in package.json)
      - run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm exec bun build src/cli.ts --compile --minify --target ${{ matrix.bun }} --outfile build/hop
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        # Apple Silicon refuses unsigned code; bun signs ad hoc, re-sign if it didn't
        run: codesign -v build/hop || { codesign --force --sign - build/hop && codesign -v build/hop; }

      - name: Install fish and zsh for the shell tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Install fish for the shell tests
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Test the executable
        run: |
          build/hop --version
          HOP_BIN=build/hop pnpm vitest run test/e2e.test.ts test/shell.test.ts

      - name: Package
        id: package
        run: |
          version="${{ inputs.version }}"
          version="${version:-$(node -p "require('./package.json').version")}"
          archive="hop-v${version}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C build hop
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
